<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">배경일 / 공지사항 구현과 회고</title>
  <desc id="desc">AX 1기 HTML/CSS 팀 프로젝트. 분류와 제목, 날짜를 정렬한 공지 화면. 오른쪽에는 담당 화면을 나타낸 장식용 레이아웃 그림.</desc>
  <defs>
